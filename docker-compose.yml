services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - scinexus-net
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data # <--- ADICIONE ESTA LINHA AQUI

  auth-service:
    build: ./auth-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - scinexus-net

  event-service:
    build: ./event-service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/event_db
      - JWT_SECRET=${JWT_SECRET} # <--- ADICIONE AQUI TAMBÉM
    depends_on:
      - db
    networks:
      - scinexus-net

  submission-service:
    build: ./submission-service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/submission_db
      - JWT_SECRET=${JWT_SECRET} # <--- ADICIONE AQUI TAMBÉM
    depends_on:
      - db
    networks:
      - scinexus-net
    volumes:
      - ./submission-service/uploads:/app/uploads

networks:
  scinexus-net:
    driver: bridge

# ADICIONE ESTE BLOCO NO FINAL DO ARQUIVO PARA CRIAR O VOLUME
volumes:
  pgdata: